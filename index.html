

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bienvenido al Mictlán</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="bienvenida">

        <h1>BIENVENIDO AL MICTLÁN</h1>

        <p>
            ¿Te gustaría atravesar los nueve niveles
            que las almas deben cruzar para llegar
            al descanso eterno?
        </p>

        <button class="boton" onclick="iniciar()">
            INICIAR RECORRIDO
        </button>

    </div>

    <audio id="sonido" preload="auto">
        <source src="seleccion.mp3" type="audio/mpeg">
    </audio>

    <script>

        function iniciar() {

            let sonido = document.getElementById("sonido");

            sonido.currentTime = 0;

            sonido.onended = function() {
                window.location.href = "recorrido.html";
            };

            sonido.play().catch(function(error) {
                alert("No se pudo reproducir el sonido. Revisa que seleccion.mp3 esté en la carpeta.");
            });

        }

    </script>

</body>
</html>
